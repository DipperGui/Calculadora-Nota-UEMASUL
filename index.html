<!doctype html>
<html lang="pt-BR">
<head>
<title>Calcula Nota</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1017">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calcula Nota">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Instrument+Sans:wght@400;500;600&family=Montserrat:wght@700&display=swap">
<style>
/* Layout: uma coluna de celular, cabeçalho só no Início, barra de abas flutuante em pílula embaixo. */
:root{
  --bg:#E6EBF3; --surface:#FFFFFF; --surface2:#DCE3EE; --ink:#101A26; --muted:#52606E; --line:#C2CCDA;
  --dot:rgba(16,26,38,.11);
  --neon-green:#0FBF38; --neon-purple:#9A1FFF; --neon-orange:#FF8A1F;
  --ok:#0FBF38; --ok-ink:#08802A; --ok-soft:rgba(15,191,56,.14);
  --warn:#FF8A1F; --warn-ink:#A84B00; --warn-soft:rgba(255,138,31,.17);
  --bad:#E5383B; --bad-ink:#B3151A; --bad-soft:rgba(229,56,59,.13);
  --t-home:#2F6BFF; --t-home-ink:#1747C9; --t-home-soft:rgba(47,107,255,.14); --t-home-glow:rgba(47,107,255,.28);
  --t-mod:#9A1FFF;  --t-mod-ink:#7410C9;  --t-mod-soft:rgba(154,31,255,.12);  --t-mod-glow:rgba(154,31,255,.26);
  --t-sim:#FF8A1F;  --t-sim-ink:#A84B00;  --t-sim-soft:rgba(255,138,31,.16);  --t-sim-glow:rgba(255,138,31,.30);
  --t-evo:#0FBF38;  --t-evo-ink:#08802A;  --t-evo-soft:rgba(15,191,56,.14);   --t-evo-glow:rgba(15,191,56,.26);
  --t-evt:#0A8F9C; --t-evt-ink:#066A75; --t-evt-soft:rgba(10,143,156,.14); --t-evt-glow:rgba(10,143,156,.28);
  --ev-s:75%; --ev-lc:46%; --ev-li:27%; --ev-ss:80%; --ev-ls:92%;
  --accent:var(--t-home); --accent-ink:var(--t-home-ink); --accent-soft:var(--t-home-soft); --glow:var(--t-home-glow);
  --crown:#F5B800; --on-accent:#FFFFFF;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --text:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --logo:'Montserrat',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50;
    --dot:rgba(233,238,243,.08);
    --neon-green:#39FF14; --neon-purple:#C25BFF; --neon-orange:#FF8A1F;
    --ok:#39FF14; --ok-ink:#6BFF4F; --ok-soft:rgba(57,255,20,.14);
    --warn:#FF8A1F; --warn-ink:#FFB066; --warn-soft:rgba(255,138,31,.18);
    --bad:#FF5A5F; --bad-ink:#FF8E92; --bad-soft:rgba(255,90,95,.16);
    --t-home:#5C8DFF; --t-home-ink:#9DB9FF; --t-home-soft:rgba(92,141,255,.18); --t-home-glow:rgba(92,141,255,.34);
    --t-mod:#C25BFF;  --t-mod-ink:#DDA0FF;  --t-mod-soft:rgba(194,91,255,.18);  --t-mod-glow:rgba(194,91,255,.34);
    --t-sim:#FF8A1F;  --t-sim-ink:#FFB066;  --t-sim-soft:rgba(255,138,31,.18);  --t-sim-glow:rgba(255,138,31,.34);
    --t-evo:#39FF14;  --t-evo-ink:#6BFF4F;  --t-evo-soft:rgba(57,255,20,.14);   --t-evo-glow:rgba(57,255,20,.28);
    --t-evt:#2EE6E0; --t-evt-ink:#8FF3EF; --t-evt-soft:rgba(46,230,224,.16); --t-evt-glow:rgba(46,230,224,.30);
  --ev-s:85%; --ev-lc:62%; --ev-li:78%; --ev-ss:45%; --ev-ls:22%;
    --on-accent:#0A1017; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1017; --surface:#141E2A; --surface2:#1D2A39; --ink:#E9EEF3; --muted:#9AA9B7; --line:#2D3E50;
  --dot:rgba(233,238,243,.08);
  --neon-green:#39FF14; --neon-purple:#C25BFF; --neon-orange:#FF8A1F;
  --ok:#39FF14; --ok-ink:#6BFF4F; --ok-soft:rgba(57,255,20,.14);
  --warn:#FF8A1F; --warn-ink:#FFB066; --warn-soft:rgba(255,138,31,.18);
  --bad:#FF5A5F; --bad-ink:#FF8E92; --bad-soft:rgba(255,90,95,.16);
  --t-home:#5C8DFF; --t-home-ink:#9DB9FF; --t-home-soft:rgba(92,141,255,.18); --t-home-glow:rgba(92,141,255,.34);
  --t-mod:#C25BFF;  --t-mod-ink:#DDA0FF;  --t-mod-soft:rgba(194,91,255,.18);  --t-mod-glow:rgba(194,91,255,.34);
  --t-sim:#FF8A1F;  --t-sim-ink:#FFB066;  --t-sim-soft:rgba(255,138,31,.18);  --t-sim-glow:rgba(255,138,31,.34);
  --t-evo:#39FF14;  --t-evo-ink:#6BFF4F;  --t-evo-soft:rgba(57,255,20,.14);   --t-evo-glow:rgba(57,255,20,.28);
    --t-evt:#2EE6E0; --t-evt-ink:#8FF3EF; --t-evt-soft:rgba(46,230,224,.16); --t-evt-glow:rgba(46,230,224,.30);
  --ev-s:85%; --ev-lc:62%; --ev-li:78%; --ev-ss:45%; --ev-ls:22%;
  --on-accent:#0A1017; color-scheme:dark;
}
html{background:var(--bg)}
body[data-tab="home"]{--accent:var(--t-home);--accent-ink:var(--t-home-ink);--accent-soft:var(--t-home-soft);--glow:var(--t-home-glow)}
body[data-tab="mod"]{--accent:var(--t-mod);--accent-ink:var(--t-mod-ink);--accent-soft:var(--t-mod-soft);--glow:var(--t-mod-glow)}
body[data-tab="sim"]{--accent:var(--t-sim);--accent-ink:var(--t-sim-ink);--accent-soft:var(--t-sim-soft);--glow:var(--t-sim-glow)}
body[data-tab="evo"]{--accent:var(--t-evo);--accent-ink:var(--t-evo-ink);--accent-soft:var(--t-evo-soft);--glow:var(--t-evo-glow)}
body[data-tab="evt"]{--accent:var(--t-evt);--accent-ink:var(--t-evt-ink);--accent-soft:var(--t-evt-soft);--glow:var(--t-evt-glow)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; background:transparent; color:var(--ink); font:500 15px/1.4 var(--text);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:10px 0; min-height:100%;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(120% 55% at 50% -12%, var(--glow), transparent 70%),
    radial-gradient(90% 40% at 50% 118%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%),
    radial-gradient(circle, var(--dot) 1.3px, transparent 1.7px) 0 0/16px 16px;
  transition:background .4s;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.app{max-width:520px;margin-inline:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:108px}
.num-font,.big{font-family:var(--display);text-transform:uppercase;letter-spacing:.01em}
.tn{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}
h2{font:800 26px/1 var(--display);text-transform:uppercase;letter-spacing:.02em}
h3{font:700 18px/1.1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.muted{color:var(--muted)}
.label{font:600 11px/1 var(--text);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}

/* cabeçalho */
.head{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{position:relative;font:700 26px/1 var(--logo);letter-spacing:-.01em;padding-top:12px;
  background:linear-gradient(100deg,var(--t-home),var(--t-mod) 55%,var(--t-evo));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo svg{position:absolute;left:-1px;top:-3px;width:20px;height:20px}
.pill-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 6px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);font-weight:600}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);font:800 16px var(--display)}
.pnav{display:flex;align-items:center;justify-content:center;gap:8px}
.chip{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.chip.neon{border-color:var(--neon-green);color:var(--ok-ink);background:var(--ok-soft);box-shadow:0 0 14px -2px var(--neon-green)}
.chip .per{font:800 17px var(--display);text-transform:uppercase;letter-spacing:.03em}

/* cartões */
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:20px;
  box-shadow:0 8px 24px -12px var(--glow);padding:16px}
.card.flat{border-top-color:var(--line);box-shadow:none}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.hero-num{font:800 76px/.9 var(--display);letter-spacing:.01em}
.hero-sub{font:700 22px/1 var(--display);color:var(--muted)}
.tag{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:999px;font:700 12px/1 var(--text);letter-spacing:.04em;text-transform:uppercase}
.tag.ok{background:var(--ok-soft);color:var(--ok-ink)}
.tag.bad{background:var(--bad-soft);color:var(--bad-ink)}
.tag.risk{background:var(--warn-soft);color:var(--warn-ink)}
.tag.track{background:var(--t-home-soft);color:var(--t-home-ink)}
.tag.none{background:var(--surface2);color:var(--muted)}
.neon-lbl{font:700 12px/1 var(--text);letter-spacing:.08em;text-transform:uppercase}
.neon-lbl.g{color:var(--ok-ink)} .neon-lbl.p{color:var(--t-mod-ink)} .neon-lbl.o{color:var(--warn-ink)}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface2);overflow:visible}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.bar .max{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.bar .got{background:var(--accent)}
.bar.ok .got{background:var(--ok)} .bar.bad .got{background:var(--bad)} .bar.risk .got{background:var(--warn)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;left:70%}
.bar-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

/* módulos */
.mod-head{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;padding:0;text-align:left}
.mod-head .nm{flex:1;min-width:0}
.mod-head .nm b{display:block;font:800 22px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.chev{width:22px;height:22px;flex:none;transition:transform .25s;color:var(--muted)}
.collapsed .chev{transform:rotate(-90deg)}
.mod-body{display:grid;gap:14px;margin-top:14px}
.collapsed .mod-body{display:none}
.blk{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:10px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fld{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px}
.fl{min-width:0;display:grid;gap:2px}
.fl b{font-weight:600}
.fl small{color:var(--muted);font-size:12.5px}
.step{display:inline-flex;align-items:center;gap:6px;flex:none}
.sb{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font:700 22px/1 var(--text);display:grid;place-items:center;padding:0}
.sb:active{background:var(--accent-soft)}
.num{width:64px;height:44px;text-align:center;font:600 17px var(--text);font-variant-numeric:tabular-nums;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 4px}
.num::placeholder{color:var(--muted)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
.res .big-n{font:800 34px/1 var(--display)}
.note{font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body[data-tab="evo"] .btn.pri,body[data-tab="sim"] .btn.pri{color:#101A26}
.scrim .btn.pri{background:var(--t-home);border-color:var(--t-home);color:var(--on-accent)}
.btn.danger{color:var(--bad-ink);border-color:var(--bad)}
.btn.wide{width:100%}

/* modo edição */
.editing .card{border-style:dashed;border-top-style:solid;border-top-color:var(--muted);box-shadow:none;background:color-mix(in srgb,var(--surface) 70%,var(--surface2))}
.editing .num{border-style:dashed;color:var(--muted);background:transparent;pointer-events:none}
.editing .sb.val{display:none}
.edit-only{display:none!important}
.editing .edit-only{display:grid!important}
.editing .slots.edit-only{display:flex!important}
.editing .view-only{display:none}
.ed-input{width:100%;min-height:44px;border:1px dashed var(--muted);border-radius:14px;background:transparent;padding:0 12px;font:600 17px var(--text)}
.slots{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}

/* carrossel */
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-block:2px 6px}
.car::-webkit-scrollbar{display:none}
.car>*{scroll-snap-align:start;flex:0 0 82%}
.dots{display:flex;justify-content:center;gap:6px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:18px;border-radius:999px}
.aviso{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--warn);border-radius:20px;padding:14px;text-align:left;display:grid;gap:6px;min-height:104px}
.aviso.late{border-top-color:var(--bad)}
.aviso.soon{border-top-color:var(--bad)}
.aviso .when{font:800 30px/1 var(--display);text-transform:uppercase}

/* navegação */
.nav{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:max(8px,calc(env(safe-area-inset-bottom,0px) - 12px));max-width:440px;margin-inline:auto;z-index:20;
  display:flex;gap:2px;padding:5px;border-radius:999px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
  box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.tab{flex:1;min-width:0;min-height:50px;border:0;background:none;border-radius:999px;display:grid;place-items:center;align-content:center;gap:2px;font:600 11px/1 var(--text);color:var(--muted);padding:4px 2px}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{background:var(--cs);color:var(--ci)}
.tab[data-t="home"]{--cs:var(--t-home-soft);--ci:var(--t-home-ink)}
.tab[data-t="mod"]{--cs:var(--t-mod-soft);--ci:var(--t-mod-ink)}
.tab[data-t="sim"]{--cs:var(--t-sim-soft);--ci:var(--t-sim-ink)}
.tab[data-t="evo"]{--cs:var(--t-evo-soft);--ci:var(--t-evo-ink)}
.tab[data-t="evt"]{--cs:var(--t-evt-soft);--ci:var(--t-evt-ink)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:19;
  width:52px;height:52px;border-radius:50%;border:1px solid var(--accent);background:var(--surface);color:var(--accent-ink);display:grid;place-items:center;
  box-shadow:0 8px 22px -6px var(--glow)}
.fab svg{width:24px;height:24px}


/* simulador e evolução */
.rowscroll{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin-inline:-16px;padding:2px 16px}
.rowscroll::-webkit-scrollbar{display:none}
.rowscroll>*{flex:none;scroll-snap-align:start;white-space:nowrap}
.snum{width:64px;height:44px;text-align:center;font:600 17px var(--text);font-variant-numeric:tabular-nums;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 4px}
.need-big{font:800 72px/.9 var(--display);letter-spacing:.01em}
.irow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:6px 0}
.irow:first-of-type{border-top:0}
.irow .iv{display:flex;align-items:center;gap:8px;flex:none}
.irow .iv b{font:800 22px/1 var(--display)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-variant-numeric:tabular-nums}
.sv-n{fill:var(--ink);font:600 13px var(--text)}
.sv-m{fill:var(--muted);font:500 11px var(--text)}
.sv-v{font:800 18px var(--display)}
.sv-pt{font:700 12px var(--text)}
.sv-ok{fill:var(--ok-ink)} .sv-risk{fill:var(--warn-ink)} .sv-bad{fill:var(--bad-ink)} .sv-track2{fill:var(--muted)}
.sv-track{fill:var(--surface2)} .sv-pot{fill:var(--line)} .sv-tut{fill:var(--t-home)} .sv-lmf{fill:var(--t-mod)}
.sv-grid{stroke:var(--line);stroke-width:1;fill:none} .sv-min{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.sv-ltut{stroke:var(--t-home);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-llmf{stroke:var(--t-mod);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sv-dtut{fill:var(--t-home);stroke:var(--surface);stroke-width:2} .sv-dlmf{fill:var(--t-mod);stroke:var(--surface);stroke-width:2}
.sv-crown{fill:var(--crown)}
.t-tut{fill:var(--t-home-ink);font:700 12px var(--text)} .t-lmf{fill:var(--t-mod-ink);font:700 12px var(--text)}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lg i.sq{border-radius:3px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface2);border-radius:16px;padding:12px;display:grid;gap:4px;min-width:0}
.tile b{font:800 28px/1 var(--display)}


/* perfil e dados */
.grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:-6px auto 0}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);display:grid;place-items:center;padding:0;color:var(--ink)}
.x-btn svg{width:20px;height:20px}
.prof{display:flex;align-items:flex-end;gap:14px}
.avatar-lg{width:64px;height:64px;flex:none;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--t-home),var(--t-mod));color:#fff;font:800 32px/1 var(--display);text-transform:uppercase}
.psec{display:grid;gap:8px}
.psec>.label{padding-inline:4px}
.group{background:var(--surface2);border-radius:18px;padding:4px 14px;display:grid}
.grow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;border-top:1px solid var(--line);font-weight:600}
.grow:first-child{border-top:0}
.segc{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface2);padding:4px;border-radius:999px}

<body>

<div class="app" id="app"></div>
<nav class="nav" id="nav" role="tablist" aria-label="Seções"></nav>
<div id="layer"></div>

<script>
(function(){
'use strict';

/* ---------- regra de cálculo (1º período) ---------- */
var W={tp:3.6,tf:2.4,lp:2.4,lf:1.6}; // pesos em pontos, somam 10
var MIN=7;
var MOD_NAMES=['Introdução à Medicina','Processos Biológicos','Metabolismo'];

function uid(){return 'i'+Math.random().toString(36).slice(2,9)}
function blanks(n){var a=[];for(var i=0;i<n;i++)a.push(null);return a}
function newModule(name,nTut,nLmf){return{id:uid(),name:name,ch:1,tut:{prova:null,form:blanks(nTut||4)},lmf:{prova:null,form:blanks(nLmf||4)}}}
function chOf(m){var v=parseFloat(m.ch);return v>0?v:1}
function migrate(st){
  if(!st||!st.periods)return st;
  if((st.mig||0)<2){
    st.periods.forEach(function(p){p.modules.forEach(function(m){
      if(String(m.name).trim().toLowerCase()==='metabolismo'&&m.tut&&m.tut.form.length===4&&m.tut.form[3]==null)m.tut.form.pop();
    })});
    st.mig=2;
  }
  if((st.mig||0)<3){
    st.periods.forEach(function(p){p.modules.forEach(function(m){
      if(String(m.name).trim().toLowerCase()==='metabolismo'&&m.lmf&&m.lmf.form.length===4&&m.lmf.form[3]==null)m.lmf.form.pop();
    })});
    st.mig=3;
  }
  if(!st.fav)st.fav={};
  return st;
}
function defaultState(){
  var p={id:uid(),name:'1º período',modules:MOD_NAMES.map(function(n,i){return newModule(n,i===2?3:4,i===2?3:4)})};
  return{v:1,mig:3,t:0,name:'Guilherme',periods:[p],cur:0,currentId:p.id,exams:[],fav:{}};
}
function pad(n){return String(n).length<2?'0'+n:String(n)}
function round2(x){return Math.round(x*100)/100}
function fmt(x,d){if(x==null||isNaN(x))return '—';var s=(d==null?(Math.round(x*100)/100):x.toFixed(d));return String(s).replace('.',',')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

/* ---------- cálculo (sempre derivado dos registros) ---------- */
function calc(m){
  var items=[];
  items.push({w:W.tp,n:m.tut.prova,g:'t'});
  m.tut.form.forEach(function(n){items.push({w:W.tf/m.tut.form.length,n:n,g:'t'})});
  items.push({w:W.lp,n:m.lmf.prova,g:'l'});
  m.lmf.form.forEach(function(n){items.push({w:W.lf/m.lmf.form.length,n:n,g:'l'})});
  var P=0,Wf=0,tP=0,lP=0,total=0;
  items.forEach(function(it){
    total+=it.w;
    if(it.n!=null){var pt=it.n/10*it.w;P+=pt;Wf+=it.w;if(it.g==='t')tP+=pt;else lP+=pt}
  });
  P=round2(P);
  var R=round2(total-Wf);
  var parcial=Wf>0?P/Wf*10:null;
  var status,need=null;
  if(Wf===0)status='none';
  else if(P>=MIN)status='ok';
  else if(round2(P+R)<MIN)status='bad';
  else{need=R>0?(MIN-P)/R*10:null;status=(need!=null&&need>MIN)?'risk':'track'}
  if(R===0&&P<MIN)status='bad';
  return{P:P,R:R,Wf:Wf,tP:round2(tP),lP:round2(lP),parcial:parcial,status:status,need:need,done:R===0}
}
function avg(arr){var f=arr.filter(function(x){return x!=null});return f.length?f.reduce(function(a,b){return a+b},0)/f.length:null}
var ST={ok:'Aprovado',bad:'Reprovado',risk:'Em risco',track:'No caminho',none:'Sem notas'};

/* ---------- armazenamento: nuvem do artefato (db + user) ou localStorage ---------- */
var LS='calcnota:v1', LS_THEME='calcnota:theme';
var store={
  mode:'local', ref:null, timer:null, err:false,
  readLocal:function(){try{var s=localStorage.getItem(LS);return s?JSON.parse(s):null}catch(e){return null}},
  writeLocal:function(st){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}},
  save:function(st){
    st.t=Date.now();
    store.writeLocal(st);
    clearTimeout(store.timer);
    store.timer=setTimeout(function(){
      if(store.ref){
        store.ref.set({json:JSON.stringify(st),t:st.t}).catch(function(){store.mode='local';store.ref=null;paintFoot()});
      }
    },500);
  },
  initCloud:function(onData){
    try{
      var c=window.claude; if(!c||!c.use)return;
      Promise.all([c.use('db'),c.use('user')]).then(function(r){
        var db=r[0],user=r[1]; if(!db||!user)return null;
        return user.id().then(function(id){
          if(!id)return null;
          var ref=db.collection('data/users/'+id).doc('calcula');
          return ref.get().then(function(snap){
            store.ref=ref;store.mode='cloud';
            var remote=null;
            if(snap.exists){try{remote=JSON.parse(snap.data().json)}catch(e){}}
            onData(remote);
          });
        });
      }).catch(function(){});
    }catch(e){}
  }
};

/* ---------- estado ---------- */
var S=store.readLocal();
if(!S||!S.periods||!S.periods.length)S=defaultState();
var _mig=S.mig;S=migrate(S);if(_mig!==S.mig)store.writeLocal(S);
var UI={tab:'home',evView:'month',evType:null,evMonth:null,evWeek:null,evSel:null,evWk:null,evFav:false,evPast:false,edit:false,open:{},toast:'',lastFocus:null};
var TAB_COLOR={home:'home',mod:'mod',sim:'sim',evo:'evo'};

function curPeriod(){return S.periods[Math.min(Math.max(S.cur,0),S.periods.length-1)]}
function isCurrent(){return curPeriod().id===S.currentId}
function commit(){store.save(S);render()}

/* ---------- datas ---------- */
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function daysUntil(s){
  var a=s.split('-');var d=new Date(+a[0],+a[1]-1,+a[2]);var n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((d-n)/86400000);
}

/* ---------- campos numéricos ---------- */
function getRef(path){
  var a=path.split('|'),mid=a[0],f=a[1].split('.');
  var m=null;curPeriod().modules.forEach(function(x){if(x.id===mid)m=x});
  if(!m)return null;
  var g=m[f[0]];
  if(f[1]==='prova')return{o:g,k:'prova'};
  return{o:g.form,k:+f[2]};
}
function parseNum(v){
  v=String(v).trim().replace(',','.');
  if(v==='')return null;
  var n=parseFloat(v);if(isNaN(n))return undefined;
  return Math.min(10,Math.max(0,Math.round(n*100)/100));
}
function field(label,hint,path,val){
  return '<div class="fld"><div class="fl"><b>'+label+'</b><small>'+hint+'</small></div>'+
  '<div class="step"><button class="sb val" data-act="dec" data-p="'+path+'" aria-label="Diminuir nota de '+label+'">−</button>'+
  '<input class="num" inputmode="decimal" autocomplete="off" data-p="'+path+'" value="'+(val==null?'':fmt(val))+'" placeholder="—" aria-label="Nota de '+label+'">'+
  '<button class="sb val" data-act="inc" data-p="'+path+'" aria-label="Aumentar nota de '+label+'">+</button></div></div>';
}
function groupFields(m,gk,label,wProva,wForm,prefix){
  var g=m[gk],out='';
  var pv=g.prova==null?'vale '+fmt(wProva)+' pts':fmt(round2(g.prova/10*wProva))+' de '+fmt(wProva)+' pts';
  out+=field('Prova',pv,m.id+'|'+gk+'.prova',g.prova);
  var n=g.form.length,each=wForm/n;
  g.form.forEach(function(v,i){
    var pt=v==null?'vale '+fmt(round2(each))+' pts':fmt(round2(v/10*each))+' de '+fmt(round2(each))+' pts';
    out+=field('Formativa '+(i+1),pt,m.id+'|'+gk+'.form.'+i,v);
  });
  var a=avg(g.form);
  out+='<div class="note">Média das formativas: <b class="tn">'+(a==null?'—':fmt(a,2))+'</b></div>';
  out+='<div class="edit-only slots"><span class="note">Notas de formativa: <b>'+n+'</b></span><span class="step">'+
   '<button class="sb" data-act="slot-" data-m="'+m.id+'" data-g="'+gk+'" aria-label="Remover uma formativa de '+label+'">−</button>'+
   '<button class="sb" data-act="slot+" data-m="'+m.id+'" data-g="'+gk+'" aria-label="Adicionar uma formativa em '+label+'">+</button></span></div>';
  return out;
}
function needText(c){
  if(c.status==='none')return 'Lance a primeira nota para ver a média parcial.';
  if(c.done)return 'Nota final <b class="tn">'+fmt(c.P,2)+'</b>. '+(c.status==='ok'?'Média '+MIN+' atingida.':'Abaixo da média '+MIN+'.');
  if(c.status==='ok')return 'Média '+MIN+' já garantida com <b class="tn">'+fmt(c.P,2)+'</b> pontos.';
  if(c.status==='bad')return 'Mesmo com 10 no que falta, o máximo é <b class="tn">'+fmt(round2(c.P+c.R),2)+'</b>.';
  return 'Faltam <b class="tn">'+fmt(c.R,2)+'</b> pts. Precisa de média <b class="tn">'+fmt(c.need,1)+'</b> no que falta para chegar a '+MIN+'.';
}

function allItems(m){

  function add(gk,gn,wp,wf){
    var g=m[gk];

    g.form.forEach(function(v,i){out.push({k:gk+'.form.'+i,label:'Formativa '+(i+1)+' · '+gn,w:wf/g.form.length,v:v})});
  }
  add('tut','Tutoria',W.tp,W.tf);add('lmf','LMF',W.lp,W.lf);

}

   '<button class="sb" data-act="sim-inc" data-f="'+f+'" aria-label="Aumentar: '+label+'">+</button></div></div>';
}
function simCompute(m,sim){
  var c=calc(m),pend=allItems(m).filter(function(i){return i.v==null});
  var X={m:m,c:c,pend:pend};
  if(!pend.length)return X;
  var it=pend[0];pend.forEach(function(p){if(p.k===sim.k)it=p});
  var assume=sim.assume!=null?sim.assume:MIN,x=sim.x!=null?sim.x:MIN;
  function needFor(item){
    var others=round2(c.R-item.w);
    var n=(MIN-c.P-others*assume/10)/item.w*10;
    var o={others:others,max:round2(c.P+others*assume/10+item.w)};
    if(n<=0.0001){o.cls='ok';o.tag='Já garantido';o.big='0';o.val=0}
    else if(n>10.0001){o.cls='bad';o.tag='Fora de alcance';o.big='>10';o.val=null}
    else{var nd=Math.ceil(n*10-1e-6)/10;o.val=nd;o.big=fmt(nd,1);o.cls=nd>MIN?'risk':'track';o.tag=nd>MIN?'Acima da média':'Alcançável'}
    return o;
  }
  X.it=it;X.assume=assume;X.x=x;X.needFor=needFor;X.nf=needFor(it);
  X.total=round2(c.P+X.nf.others*assume/10+it.w*x/10);
  X.okc=X.total>=MIN;
  return X;
}

  }).join('')+'</div>':'<p class="note">Todas as avaliações deste módulo já têm nota.</p>';
  return '<section class="card stack">'+stepHead(1,'Escolha o que simular')+

}

function partResult(X,o){
  var nf=X.nf,it=X.it,c=X.c;
  var pi=round2(it.w*X.x/10),po=round2(nf.others*X.assume/10);
  var left='<div class="rbox"><span class="label">Preciso tirar</span><span class="need-big tn">'+nf.big+'</span><span class="tag '+nf.cls+'">'+nf.tag+'</span></div>';
  var right='<div class="rbox"><span class="label">Módulo fica com</span><span class="need-big tn">'+fmt(X.total,2)+'</span><span class="tag '+(X.okc?'ok':'bad')+'">'+(X.okc?'Passa':'Não passa')+'</span></div>';
  var bar='<div class="sbarw"><div class="sbar" role="img" aria-label="Já tenho '+fmt(c.P,2)+' pontos, esta avaliação soma '+fmt(pi,2)+(po>0?', as outras somam '+fmt(po,2):'')+', de 10"><i style="width:'+Math.min(100,c.P*10)+'%;background:var(--t-home)"></i><i style="width:'+Math.min(100,pi*10)+'%;background:var(--accent)"></i><i style="width:'+Math.min(100,po*10)+'%;background:var(--line)"></i></div><span class="mk"></span></div>'+

    '<div class="row" style="gap:12px;flex-wrap:wrap"><span class="lg"><i class="sq" style="background:var(--t-home)"></i>Já tenho '+fmt(c.P,2)+'</span><span class="lg"><i class="sq" style="background:var(--accent)"></i>Esta avaliação +'+fmt(pi,2)+'</span>'+(po>0?'<span class="lg"><i class="sq" style="background:var(--line)"></i>Outras +'+fmt(po,2)+'</span>':'')+'</div>';
  var s1;
  if(nf.cls==='ok')s1='A média '+MIN+' já está garantida'+(nf.others>0?', supondo '+fmt(X.assume)+' nas outras que faltam':'')+'.';
  else if(nf.cls==='bad')s1='Mesmo com 10 em <b>'+esc(it.label)+'</b>, o módulo chega só a <b class="tn">'+fmt(nf.max,2)+'</b>'+(nf.others>0?', supondo '+fmt(X.assume)+' nas outras':'')+'.';
  else s1='Para fechar média '+MIN+' você precisa de <b class="tn">'+nf.big+'</b> em <b>'+esc(it.label)+'</b>'+(nf.others>0?', supondo '+fmt(X.assume)+' nas outras':'')+'.';
  var s2=' Com <b class="tn">'+fmt(X.x)+'</b> nela, o módulo termina com <b class="tn">'+fmt(X.total,2)+'</b>.';
  return '<section class="card stack">'+stepHead(3,'Veja o resultado')+
    '<div class="res2">'+hw(o,'need','E',left)+hw(o,'total','F',right)+'</div>'+
    hw(o,'bar','G',bar)+'<p class="note">'+s1+s2+'</p></section>';
}
function partList(X,o){
  if(X.pend.length<2)return '';

function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function keyDate(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function byDay(list){var m={};list.forEach(function(e){(m[e.date]=m[e.date]||[]).push(e)});return m}
function navBtns(act,n0){

function evMonth(list){
  var tk=todayKey(),now=new Date();
  if(!UI.evMonth)UI.evMonth={y:now.getFullYear(),m:now.getMonth()};
  var y=UI.evMonth.y,mo=UI.evMonth.m,map=byDay(list);
  var nd=new Date(y,mo+1,0).getDate(),lead=new Date(y,mo,1).getDay(),prefix=y+'-'+pad(mo+1)+'-';
  var sel=UI.evSel&&UI.evSel.indexOf(prefix)===0?UI.evSel:null;
  var inMonth=list.filter(function(e){return e.date.indexOf(prefix)===0});
  var h='<div class="monhero"><div><span class="monyr">'+y+'</span><h3 class="monname">'+MONTHS_L[mo]+'</h3></div>'+navBtns('ev-mnav','Hoje')+'</div>';
  h+='<section class="card calcard"><div class="cal">'+WDAYS.map(function(w){return '<div class="wd">'+w.charAt(0)+'</div>'}).join('');
  for(var i=0;i<lead;i++)h+='<div class="cd blank"></div>';
  for(var d=1;d<=nd;d++){
    var k=prefix+pad(d),evs=map[k]||[];
    var dots=evs.slice(0,3).map(function(e){return '<i class="evk'+(e.hue<0?' ev-gray':'')+(e.st==='cx'?' cx':'')+'" style="--h:'+Math.max(e.hue,0)+'"></i>'}).join('')+(evs.length>3?'<em>+</em>':'');
    h+='<button class="cd'+(k===tk?' today':'')+(evs.length?' has':'')+'" data-act="ev-day" data-d="'+k+'" aria-pressed="'+(k===sel)+'" aria-label="'+d+' de '+MONTHS_L[mo]+(evs.length?', '+evs.length+' evento'+(evs.length>1?'s':''):'')+'">'+d+'<span class="cdots">'+dots+'</span></button>';
  }
  h+='</div></section>';
  var shown=sel?(map[sel]||[]):inMonth;
  if(sel){var dl=dayLabel(sel);h+='<div class="row between"><div class="evday" style="padding:0">'+dl[0]+(dl[1]?'<small>'+dl[1]+'</small>':'')+'</div><button class="chip" style="min-height:36px" data-act="ev-day" data-d="'+sel+'">Ver o mês todo</button></div>'}
  else h+='<div class="evday" style="padding-bottom:0">Eventos do mês<small>'+inMonth.length+'</small></div>';
  if(!shown.length)h+='<p class="evnone">'+(sel?'Sem eventos neste dia.':'Nenhum evento em '+MONTHS_L[mo]+'.')+'</p>';
  else h+=shown.map(function(e){return evCard(e)}).join('');

}
var HH=38,TW=44;
function mins(t){return t?(+t.slice(0,2))*60+(+t.slice(3,5)):null}
function fmtT(t){return t.replace(':','h').replace(/h00$/,'h')}
function layLanes(evs){
  var out=[],cl=[],end=-1;
  var flush=function(){var ln=[];cl.forEach(function(x){var l=0;while(ln[l]!==undefined&&ln[l]>x.s)l++;ln[l]=x.e;x.l=l});var n=ln.length;cl.forEach(function(x){x.n=n});out=out.concat(cl);cl=[]};
  evs.forEach(function(x){if(cl.length&&x.s>=end){flush();end=-1}end=Math.max(end,x.e);cl.push(x)});
  flush();return out;
}
function evWeek(list){
  var now=new Date(),tk=todayKey();
  if(!UI.evWeek)UI.evWeek=keyOf(addDays(now,-now.getDay()));
  var s=keyDate(UI.evWeek),e=addDays(s,6),map=byDay(list);
  var rng=s.getDate()+(s.getMonth()!==e.getMonth()?' '+MONTHS[s.getMonth()]:'')+' – '+e.getDate()+' '+MONTHS[e.getMonth()];
  var h='<div class="monhero"><div><span class="monyr">'+e.getFullYear()+'</span><h3 class="monname" style="font-size:36px">'+rng+'</h3></div>'+navBtns('ev-wnav','Hoje')+'</div>';
  var heads='',cols='',minStart=null,todayIdx=-1;
  for(var i=0;i<7;i++){
    var d=addDays(s,i),k=keyOf(d),evs=map[k]||[],isT=k===tk;
    if(isT)todayIdx=i;
    var allday=evs.filter(function(x){return !x.time}),timed=evs.filter(function(x){return x.time}).map(function(x){
      var st=mins(x.time),en=x.end?mins(x.end):st+60;if(en<=st)en=st+60;if(en>1440)en=1440;
      if(minStart===null||st<minStart)minStart=st;
      return{ev:x,s:st,e:en}});
    timed.sort(function(a,b){return a.s-b.s||a.e-b.e});
    heads+='<div class="wkhd evk'+(isT?' today':'')+'"><span class="evmo">'+WDAYS[d.getDay()]+'</span><b>'+d.getDate()+'</b>'+
      (allday.length?'<div class="wkad">'+allday.map(function(x){return '<button class="evk'+(x.hue<0?' ev-gray':'')+'" style="--h:'+Math.max(x.hue,0)+'" data-act="ev-open" data-id="'+esc(x.id)+'">'+esc(x.title)+'</button>'}).join('')+'</div>':'')+'</div>';
    cols+='<div class="wkcol'+(isT?' today':'')+'">'+layLanes(timed).map(function(x){
      var ev=x.ev,top=x.s/60*HH,ht=Math.max((x.e-x.s)/60*HH-2,20),w=100/x.n;
      var fav=S.fav&&S.fav[ev.id];
      return '<button class="wkev evk'+(x.n>1?' nar':'')+(ev.hue<0?' ev-gray':'')+(ev.st==='cx'?' cx':'')+'" style="--h:'+Math.max(ev.hue,0)+';top:'+top+'px;height:'+ht+'px;left:calc('+(x.l*w)+'% + 2px);width:calc('+w+'% - 4px)" data-act="ev-open" data-id="'+esc(ev.id)+'">'+
        (ev.st?'<span class="dot '+ev.st+'"></span>':'')+'<b>'+(fav?'★ ':'')+esc(ev.title)+'</b>'+(ht>=44?'<i>'+fmtT(ev.time)+(ev.end?'–'+fmtT(ev.end):'')+'</i>':'')+'</button>';
    }).join('')+(isT?'<div class="wknow" style="top:'+((now.getHours()*60+now.getMinutes())/60*HH)+'px"></div>':'')+'</div>';
  }
  var hrs='';for(var hr=0;hr<24;hr++)hrs+='<span style="top:'+(hr*HH)+'px">'+pad(hr)+':00</span>';
  var first=minStart!==null?minStart:(todayIdx>=0?Math.max(0,now.getHours()-1)*60:7*60);
  h+='<div id="wk" class="wkscroll" style="--hh:'+HH+'px;--tw:'+TW+'px" data-first="'+first+'" data-today="'+todayIdx+'"><div class="wkgrid"><div class="wkcorner"></div>'+heads+'<div class="wktime">'+hrs+'</div>'+cols+'</div></div>';
  h+='<p class="wkhint">Arraste para os lados para ver os outros dias e para cima ou para baixo para ver os horários.</p>';
  return h;
}
function bindWk(){
  var sc=document.getElementById('wk');if(!sc)return;
  var cw=Math.max(60,(sc.clientWidth-TW)/3);
  sc.style.setProperty('--colw',cw+'px');
  var co=sc.querySelector('.wkcorner');if(co)sc.style.scrollPaddingTop=co.offsetHeight+'px';
  var st=UI.evWk;
  if(st){sc.scrollLeft=st.x;sc.scrollTop=st.y}
  else{
    var ti=+sc.getAttribute('data-today'),f=+sc.getAttribute('data-first');
    sc.scrollTop=Math.max(0,(Math.floor(f/60)-1)*HH);
    if(ti>0)sc.scrollLeft=Math.min(ti,4)*cw;
    UI.evWk={x:sc.scrollLeft,y:sc.scrollTop};
  }
  sc.addEventListener('scroll',function(){UI.evWk={x:sc.scrollLeft,y:sc.scrollTop}},{passive:true});
}

  return '<div class="rowscroll"><button class="chip tchip" data-act="ev-type" data-v="" aria-pressed="'+!UI.evType+'">Todos os tipos</button>'+ts.map(function(t){

  if(UI.evPast)list=list.slice().reverse();
  if(!list.length)return h+'<section class="card" style="text-align:center"><p class="note">'+(UI.evFav||UI.evType?'Nenhum evento com esses filtros.':(UI.evPast?'Nenhum evento passado na planilha.':'Nenhum evento futuro por enquanto.'))+'</p></section>';
  return h+list.map(function(e){return evCard(e)}).join('');
}
function loadEvents(){
  if(EV.loading)return;
  EV.loading=true;EV.err=false;
  if(UI.tab==='evt')render();
  var done=function(){EV.loading=false;if(UI.tab==='evt')render()};
  var ctl=typeof AbortController!=='undefined'?new AbortController():null,to=ctl?setTimeout(function(){ctl.abort()},15000):0;
  fetch(EVENTS_URL+'&_='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined}).then(function(r){
    if(!r.ok)throw new Error('http');return r.text();
  }).then(function(txt){
    var list=parseEvents(txt);
    if(!list)throw new Error('formato');
    EV.list=list;EV.t=Date.now();EV.err=false;
    try{localStorage.setItem(LS_EV,JSON.stringify({t:EV.t,list:list}))}catch(e){}
    clearTimeout(to);done();
  }).catch(function(){clearTimeout(to);EV.err=true;done()});
}

function crOf(mods){
  var num=0,den=0,part=false;
  mods.forEach(function(m){var c=calc(m);if(c.Wf>0){var w=chOf(m);num+=c.parcial*w;den+=w;if(!c.done)part=true}else part=true});
  return den>0?{cr:num/den,partial:part}:{cr:null,partial:true};
}

function bindCar(){
  var car=document.getElementById('car'),dots=document.getElementById('dots');
  if(!car||!dots)return;
  car.addEventListener('scroll',function(){
    var kids=car.children,best=0,bd=1e9;
    for(var i=0;i<kids.length;i++){var d=Math.abs(kids[i].offsetLeft-car.scrollLeft-16);if(d<bd){bd=d;best=i}}
    var ds=dots.children;for(var j=0;j<ds.length;j++)ds[j].className=j===best?'on':'';
  },{passive:true});
}

    up:svg('<path d="M12 20V9M7 13l5-5 5 5M5 4h14"/>')
  };
  var seg=[['auto','Auto'],['light','Claro'],['dark','Escuro']].map(function(t){
    return '<button data-act="theme" data-v="'+t[0]+'" aria-pressed="'+(th===t[0])+'">'+I[t[0]]+'<span>'+t[1]+'</span></button>';
  }).join('');
  var per=S.periods.map(function(p){
    return '<div class="grow"><span>'+esc(p.name)+'</span>'+(p.id===S.currentId?'<span class="tag ok">Atual</span>':'')+'</div>';
  }).join('');
  var cloud=store.mode==='cloud';
  openSheet('<div class="grab"></div>'+
   '<div class="sh-head"><h2>Perfil e dados</h2><button class="x-btn" data-act="close" aria-label="Fechar">'+I.x+'</button></div>'+
   '<div class="prof"><span class="avatar-lg" id="p-av" aria-hidden="true">'+esc((S.name||'?').trim().charAt(0))+'</span>'+
     '<label class="field" style="flex:1;min-width:0"><span>Seu nome</span><input class="inp" id="p-name" maxlength="30" autocomplete="off" value="'+esc(S.name)+'"></label></div>'+
   '<div class="psec"><span class="label">Aparência</span><div class="segc" role="group" aria-label="Tema">'+seg+'</div></div>'+
   '<div class="psec"><span class="label">Períodos</span><div class="group">'+per+
     '<button class="rowbtn" data-act="period-new"><span class="ri">'+I.plus+'</span><span class="rt"><b>Novo período</b><small>Começa sem módulos</small></span></button>'+
     (curPeriod().id!==S.currentId?'<button class="rowbtn" data-act="period-cur"><span class="ri">'+I.flag+'</span><span class="rt"><b>Marcar '+esc(curPeriod().name)+' como atual</b></span></button>':'')+
   '</div></div>'+
   '<div class="psec"><span class="label">Dados</span><div class="group">'+
     '<button class="rowbtn" data-act="backup"><span class="ri">'+I.down+'</span><span class="rt"><b>Backup dos dados</b><small>Guarda uma cópia das suas notas</small></span></button>'+
     '<button class="rowbtn" data-act="restore"><span class="ri">'+I.up+'</span><span class="rt"><b>Restaurar dados</b><small>Volta a partir de uma cópia</small></span></button>'+
     '<div class="grow"><span class="tag '+(cloud?'ok':'risk')+'" id="foot-mode">'+(cloud?'Salvo na sua conta':'Salvo só neste aparelho')+'</span></div>'+
   '</div></div>'+
   '<button class="btn pri wide" data-act="profile-save">Concluir</button>');
}
function periodSheet(){
  openSheet('<h2>Novo período</h2><label class="field"><span>Nome</span><input class="inp" id="n-name" maxlength="30" value="'+(S.periods.length+1)+'º período"></label>'+
   '<p class="note">O novo período começa sem módulos. Adicione-os em Módulos, no modo Editar plano. Ele vira o período atual.</p>'+
   '<div class="row" style="gap:8px"><button class="btn pri" style="flex:1" data-act="period-save">Criar</button><button class="btn" data-act="close">Cancelar</button></div>');
}
function backupSheet(json){
  openSheet('<h2>Backup dos dados</h2><p class="note">Copie este texto e guarde em um lugar seguro. Para restaurar, cole em Restaurar dados.</p>'+
   '<textarea class="inp" id="b-text" readonly>'+esc(json)+'</textarea>'+
   '<div class="row" style="gap:8px"><button class="btn pri" style="flex:1" data-act="copy-backup">Copiar</button><button class="btn" data-act="close">Fechar</button></div>');
}
function restoreSheet(){
  openSheet('<h2>Restaurar dados</h2><p class="note">Escolha o arquivo do backup ou cole o texto abaixo. Isso substitui os dados deste aparelho.</p>'+
   '<label class="field"><span>Arquivo .json</span><input class="inp" type="file" id="r-file" accept="application/json,.json" style="padding-top:10px"></label>'+
   '<label class="field"><span>Ou cole o texto</span><textarea class="inp" id="r-text" placeholder="{...}"></textarea></label>'+
   '<p class="note" id="r-err" role="alert" style="color:var(--bad-ink)"></p>'+
   '<div class="row" style="gap:8px"><button class="btn pri" style="flex:1" data-act="restore-go">Restaurar</button><button class="btn" data-act="close">Cancelar</button></div>',
   function(sh){
     sh.querySelector('#r-file').addEventListener('change',function(ev){
       var f=ev.target.files[0];if(!f)return;var rd=new FileReader();
       rd.onload=function(){sh.querySelector('#r-text').value=String(rd.result||'')};rd.readAsText(f);
     });
   });
}
function validState(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.periods)||!o.periods.length)return false;
  return o.periods.every(function(p){return p&&typeof p.id==='string'&&Array.isArray(p.modules)&&p.modules.every(function(m){
    return m&&m.tut&&m.lmf&&Array.isArray(m.tut.form)&&Array.isArray(m.lmf.form)&&m.tut.form.length>0&&m.lmf.form.length>0;
  })});
}
function setTheme(v){
  var r=document.documentElement;
  if(v==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',v);
  try{localStorage.setItem(LS_THEME,v)}catch(e){}
}

/* ---------- eventos ---------- */
var delT=null;
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act],[data-t]');
  if(!t){if(ev.target.id==='scrim')closeSheet();return}
  if(t.hasAttribute('data-t')&&t.classList.contains('tab')){UI.tab=t.getAttribute('data-t');render();window.scrollTo(0,0);if(UI.tab==='evt'&&(EV.err||!EV.list||Date.now()-EV.t>300000))loadEvents();return}
  var a=t.getAttribute('data-act');
  if(a==='pprev'){if(S.cur>0){S.cur--;commit()}}
  else if(a==='pnext'){if(S.cur<S.periods.length-1){S.cur++;commit()}}
  else if(a==='today'){S.cur=Math.max(0,S.periods.findIndex(function(p){return p.id===S.currentId}));commit()}
  else if(a==='ev-view'){UI.evView=t.getAttribute('data-v');UI.evWk=null;render()}
  else if(a==='ev-day'){var dd=t.getAttribute('data-d');UI.evSel=UI.evSel===dd?null:dd;render()}
  else if(a==='ev-type'){UI.evType=t.getAttribute('data-v')||null;render()}
  else if(a==='ev-mnav'){var nn=+t.getAttribute('data-n'),nw=new Date();
    if(nn===0){UI.evMonth={y:nw.getFullYear(),m:nw.getMonth()};UI.evSel=null}
    else{var md=new Date(UI.evMonth.y,UI.evMonth.m+nn,1);UI.evMonth={y:md.getFullYear(),m:md.getMonth()};UI.evSel=null}
    render()}
  else if(a==='ev-wnav'){var wn=+t.getAttribute('data-n'),wd=new Date();
    UI.evWk=null;UI.evWeek=wn===0?keyOf(addDays(wd,-wd.getDay())):keyOf(addDays(keyDate(UI.evWeek),7*wn));render()}
  else if(a==='ev-refresh')loadEvents();
  else if(a==='ev-fv'){UI.evFav=t.getAttribute('data-v')==='1';render()}
  else if(a==='ev-past'){UI.evPast=!UI.evPast;render()}
  else if(a==='ev-open')evOpen(t.getAttribute('data-id'));
  else if(a==='ev-fav'){
    var fid=t.getAttribute('data-id');if(!S.fav)S.fav={};
    if(S.fav[fid])delete S.fav[fid];else S.fav[fid]=1;
    S.t=Date.now();store.save(S);
    var on=!!S.fav[fid];
    document.querySelectorAll('[data-act="ev-fav"]').forEach(function(b){if(b.getAttribute('data-id')===fid){b.setAttribute('aria-pressed',String(on));if(b.classList.contains('btn'))b.textContent=on?'★ Nos favoritos':'☆ Marcar como favorito'}});
    if(UI.evFav&&!on&&!document.querySelector('.sheet'))render();
  }
  else if(a==='profile')profileSheet();
  else if(a==='close')closeSheet();
  else if(a==='toggle'){var m=t.getAttribute('data-m');UI.open[m]=!UI.open[m];render()}
  else if(a==='goto-mod'){var id=t.getAttribute('data-m');UI.open[id]=true;UI.tab='mod';render();var el=document.getElementById('m-'+id);if(el)el.scrollIntoView({block:'start'})}
  else if(a==='edit'){UI.edit=!UI.edit;render()}
  else if(a==='sim-mod'){UI.sim={mid:t.getAttribute('data-m'),k:null,assume:null,x:null};render()}
  else if(a==='sim-help')guideSheet();
  else if(a==='sim-item'){var fromList=t.classList.contains('irow');UI.sim.k=t.getAttribute('data-k');UI.sim.x=null;render();if(fromList)window.scrollTo(0,0)}
  else if(a==='sim-inc'||a==='sim-dec'){
    var sf=t.getAttribute('data-f'),sv=parseNum(document.getElementById('sim-'+sf).value);
    if(sv==null)sv=MIN;
    sv=Math.min(10,Math.max(0,Math.round((sv+(a==='sim-inc'?.5:-.5))*100)/100));
    UI.sim[sf]=sv;render();
  }
  else if(a==='evo-mod'){UI.evoMod=t.getAttribute('data-m');render()}
  else if(a==='inc'||a==='dec'){
    var r=getRef(t.getAttribute('data-p'));if(!r)return;
    var v=r.o[r.k];
    if(v==null)v=5;else v=Math.min(10,Math.max(0,Math.round((v+(a==='inc'?.5:-.5))*100)/100));
    r.o[r.k]=v;commit();
  }
  else if(a==='slot+'||a==='slot-'){
    var mm=curPeriod().modules.filter(function(x){return x.id===t.getAttribute('data-m')})[0];if(!mm)return;
    var g=mm[t.getAttribute('data-g')];
    if(a==='slot+'&&g.form.length<12)g.form.push(null);
    if(a==='slot-'&&g.form.length>1)g.form.pop();
    commit();
  }
  else if(a==='add-mod'){curPeriod().modules.push(newModule('Novo módulo'));commit()}
  else if(a==='del-mod'){
    if(t.getAttribute('data-armed')==='1'){
      var per=curPeriod(),id2=t.getAttribute('data-m');
      per.modules=per.modules.filter(function(x){return x.id!==id2});
      S.exams=S.exams.filter(function(x){return x.moduleId!==id2});commit();
    }else{t.setAttribute('data-armed','1');t.textContent='Toque de novo para excluir';clearTimeout(delT);delT=setTimeout(function(){t.setAttribute('data-armed','0');t.textContent='Excluir módulo'},3500)}
  }
  else if(a==='exam-new')examSheet(null);
  else if(a==='exam-edit')examSheet(t.getAttribute('data-id'));
  else if(a==='exam-save'){
    var id3=t.getAttribute('data-id');var d=document.getElementById('x-date').value;
    if(!d){toast('Escolha a data da avaliação');return}
    var rec={id:id3||uid(),moduleId:document.getElementById('x-mod').value,kind:document.getElementById('x-kind').value,date:d,note:document.getElementById('x-note').value.trim()};
    if(!rec.moduleId){toast('Crie um módulo antes de marcar uma avaliação');return}
    if(id3)S.exams=S.exams.map(function(x){return x.id===id3?rec:x});else S.exams.push(rec);
    store.save(S);closeSheet();toast('Avaliação marcada');
  }
  else if(a==='exam-del'){var id4=t.getAttribute('data-id');S.exams=S.exams.filter(function(x){return x.id!==id4});store.save(S);closeSheet()}
  else if(a==='theme'){var tv=t.getAttribute('data-v');setTheme(tv);document.querySelectorAll('.segc button').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===tv))})}
  else if(a==='profile-save'){var n=document.getElementById('p-name').value.trim();if(n)S.name=n;store.save(S);closeSheet()}
  else if(a==='period-new')periodSheet();
  else if(a==='period-save'){
    var nm=document.getElementById('n-name').value.trim()||'Novo período';
    var p={id:uid(),name:nm,modules:[]};S.periods.push(p);S.cur=S.periods.length-1;S.currentId=p.id;store.save(S);closeSheet();UI.tab='mod';render();
  }
  else if(a==='period-cur'){S.currentId=curPeriod().id;store.save(S);closeSheet();toast('Período atual definido')}
  else if(a==='backup'){
    var json=JSON.stringify(S,null,2);
    var c=window.claude;
    var fallback=function(){backupSheet(json)};
    if(c&&c.use){c.use('downloads').then(function(dl){
      if(!dl){fallback();return}
      dl.save({filename:'calcula-nota-backup.json',data:json}).then(function(){toast('Backup salvo')}).catch(function(e){if(e&&e.code==='declined')return;fallback()});
    }).catch(fallback)}else fallback();
  }
  else if(a==='copy-backup'){
    var ta=document.getElementById('b-text');ta.select();
    var done=function(){toast('Copiado')};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(ta.value).then(done).catch(function(){ta.select();toast('Selecione e copie o texto')})}
    else toast('Selecione e copie o texto');
  }
  else if(a==='restore')restoreSheet();
  else if(a==='restore-go'){
    var txt=document.getElementById('r-text').value.trim(),err=document.getElementById('r-err');
    try{var o=JSON.parse(txt);if(!validState(o))throw 0;o=migrate(o);
      o.cur=Math.min(Math.max(+o.cur||0,0),o.periods.length-1);if(!o.currentId)o.currentId=o.periods[0].id;if(!Array.isArray(o.exams))o.exams=[];if(!o.name)o.name=S.name;
      S=o;store.save(S);closeSheet();toast('Dados restaurados');
    }catch(e){err.textContent='Esse texto não parece um backup do Calcula Nota.'}
  }
});
document.addEventListener('change',function(ev){
  var el=ev.target;
  if(el.classList&&el.classList.contains('snum')){
    var sf2=el.getAttribute('data-f'),sv2=parseNum(el.value);
    if(sv2==null){toast('Digite uma nota de 0 a 10');render();return}
    UI.sim[sf2]=sv2;render();
  }else if(el.classList&&el.classList.contains('num')){
    var r=getRef(el.getAttribute('data-p'));if(!r)return;
    var v=parseNum(el.value);
    if(v===undefined){el.value=r.o[r.k]==null?'':fmt(r.o[r.k]);toast('Digite uma nota de 0 a 10');return}
    r.o[r.k]=v;commit();
  }else if(el.id==='p-name'){
    var nn=el.value.trim();if(nn){S.name=nn;store.save(S)}
  }else if(el.hasAttribute&&el.hasAttribute('data-ch')){
    var idc=el.getAttribute('data-ch'),pv=parseFloat(String(el.value).replace(',','.'));
    curPeriod().modules.forEach(function(m){if(m.id===idc){if(pv>0&&pv<=9999)m.ch=pv;el.value=fmt(chOf(m))}});
    store.save(S);render();
  }else if(el.hasAttribute&&el.hasAttribute('data-name')){
    var id=el.getAttribute('data-name');
    curPeriod().modules.forEach(function(m){if(m.id===id)m.name=el.value.trim()||m.name});
    store.save(S);
  }
});
document.addEventListener('input',function(ev){
  if(ev.target.id==='p-name'){var av=document.getElementById('p-av');if(av)av.textContent=(ev.target.value.trim().charAt(0)||'?')}
});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&document.getElementById('scrim'))closeSheet();
  if(ev.key==='Enter'&&ev.target.classList&&(ev.target.classList.contains('num')||ev.target.classList.contains('snum')))ev.target.blur();
  if(ev.key==='Tab'){
    var sh=document.querySelector('.sheet');if(!sh)return;
    var f=sh.querySelectorAll('button,input,select,textarea,[href]');if(!f.length)return;
    var first=f[0],last=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
    else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
  }
});

/* ---------- início ---------- */
try{var th=localStorage.getItem(LS_THEME);if(th&&th!=='auto')document.documentElement.setAttribute('data-theme',th)}catch(e){}
render();
evInit();
store.initCloud(function(remote){
  var local=S;
  if(remote&&validState(remote)){
    remote=migrate(remote);
    if((remote.t||0)>=(local.t||0)){S=remote;store.writeLocal(S);render()}
    else store.save(local);
  }else if(local.t){store.save(local)}
  paintFoot();
});
window.__calc=calc;window.__W=W;
})();
</script>
